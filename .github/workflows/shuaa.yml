name: Shuaa benchmark and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: 'Validation leaderboard or locked final test'
        type: choice
        options: [validation, test]
        default: validation

permissions:
  contents: read

concurrency:
  group: shuaa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - run: pip install -r requirements-eval.txt
      - run: python -m unittest discover -s tests -p 'test_benchmark*.py' -v
      - run: python -m unittest discover -s tests -p 'test_finalists.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  evaluate:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - run: pip install -r requirements-eval.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: infrared-original-v1-${{ hashFiles('benchmark/constants.py', 'benchmark/split.json') }}
      - name: Evaluate submissions with the shared evaluator
        id: assessment
        continue-on-error: true
        env:
          EVALUATION_PHASE: ${{ inputs.phase || 'validation' }}
        shell: bash
        run: |
          if find submissions -maxdepth 1 -name '*.json' -print -quit | grep -q .; then
            python scripts/prepare_dataset.py
            if [ "$EVALUATION_PHASE" = "test" ]; then
              python scripts/evaluate_submissions.py --phase test --finalists config/finalists.json
            else
              python scripts/evaluate_submissions.py --phase validation
            fi
          else
            echo 'No submitted models yet. Publishing the honest empty leaderboard.'
          fi
      - name: Report evaluation failures
        if: steps.assessment.outcome == 'failure'
        run: echo '::warning::Evaluation failed. See evaluator logs and failure records; previous successful results are preserved.'
      - name: Preserve evaluator-generated results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results public/data/leaderboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Shuaa benchmark results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: verified-leaderboard
          path: public/data/leaderboard.json
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-leaderboard
          path: public/data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish Shuaa
        id: deployment
        uses: actions/deploy-pages@v4
